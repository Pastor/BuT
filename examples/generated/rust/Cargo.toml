# Проверочный крейт порождённого Rust.
#
# Аналог `CMakeLists.txt` цели `c`: собирает порождённые модули и запускает по
# исполняемому файлу на модель, который прогоняет автомат на подставном
# аппаратном слое и проверяет наблюдаемое поведение (`assert!`).
#
# Крейт намеренно не входит в workspace репозитория (собственная таблица
# `[workspace]` ниже): его содержимое - порождённый код, он перезаписывается
# `taktc` и не должен попадать под `cargo check`/`clippy --all-targets` корня.
# Строгая проверка (`rustc` и `clippy` с `-D warnings` в профиле `no_std`) живёт в
# `scripts/precheck.sh` и проверяет сами `.rs`, а не этот крейт.
#
# почему каркас лежит в `src/`, а порождённые файлы - в корне. Проверка перебирает
# `examples/generated/rust/*.rs` и заворачивает каждый файл в корень крейта с
# `#![no_std]`. Положи `lib.rs` рядом - проверка приняла бы его за порождённый модуль и
# каркас, и `main`-ы (которые печатают, то есть требуют std). Поэтому здесь
# ровно два уровня: корень - порождённое, `src/` - рукописное.
[package]
name = "takt-generated-examples"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[lib]
name = "takt_generated"
path = "src/lib.rs"
