[workspace]
resolver = "3"
members = [
    "takt-lang",
    "takt-sim",
    # Привязки для браузера. Членство в workspace - решение проекта
    # 2026-09-04: крейт собирается тем же cargo, делит `Cargo.lock` и попадает
    # под проверки, которые перечисляют крейты списком. Отдельным workspace
    # остаётся только сервер публикаций.
    "takt-wasm",
    # Проект на диске и в архиве: роды файлов, манифест, состав. Без
    # компилятора - его берёт и сервер проектов, который с `takt-lang` не
    # линкуется.
    "takt-project",
    # Схема модели вне страницы: чтение раскладки, геометрия холста, чертёж.
    # Его зовут командная строка и модуль под браузер - картинка одна у обоих.
    "takt-scheme"
]

# Отладочная информация тестовых целей урезана до таблиц строк. Мера - не вкусовая: замер показал, что дороже всего в стадии
# `cargo test` обходится первый запуск свежесобранного бинарника (0.60 с при
# загрузке ЦП 2 % - проверка кода ядром, чтение с диска, работа динамического
# загрузчика), а их 147. Полные отладочные таблицы раздувают файл и платятся
# этим временем на каждом прогоне.
#
# Замер на пустом каталоге сборки, устоявшейся ФС и втором прогоне:
#   debug = true               компиляция 29.3 с, первый запуск 20 целей 12.07 с
#   debug = "line-tables-only" компиляция 26.7 с, первый запуск 20 целей  8.13 с
#
# Профиль `test`, а не `dev`: эффект тот же (у `dev` 27.0 с и 8.10 с),
# но `dev` управляет отладкой бинарников `taktc`/`takt-sim`/`takt-lsp`, и
# урезать их отладочную информацию незачем.
# Обратные трассы сохраняются - `line-tables-only` оставляет номера строк;
# под отладчиком теряются только значения локальных переменных.
[profile.test]
debug = "line-tables-only"

# Профиль модуля WebAssembly. Свой, а не общий `release`: браузеру
# важен вес загрузки, а `taktc`/`takt-sim` собираются для машины, где размер
# бинарника значения не имеет - менять их профиль ради веба было бы платой не
# по адресу.
#
# `panic = "abort"` здесь безвреден: в модуле паника и так есть `abort` (раскрутки
# в wasm нет), а разворачивающий код в файл всё же попадал.
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
