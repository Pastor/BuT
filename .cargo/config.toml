# Единый каталог сборки для всех потребителей cargo.
#
# Замер 2026-08-18: самоочистка предкоммита следит только за
# `target/precheck`, а редактор и ручные `cargo build`/`cargo test` писали в
# `target/debug`, `target/release`, `target/flycheck0` - и накопили 47.7 ГиБ /
# 198 621 файл, после чего полный предкоммит деградировал (cargo обходит
# каталог перед каждой единицей компиляции). После очистки тот же прогон занял
# 152 с при нормативе 233 с.
#
# Направляя сюда всех, мы кладём весь кэш под уже существующий присмотр.
# `precheck.sh` при этом ничего не теряет: он экспортирует CARGO_TARGET_DIR, а
# переменная окружения сильнее этого файла - значение просто совпадает.
#
# цена, о которой надо знать: cargo берёт блокировку на каталог сборки, и
# параллельные сборки ждут друг друга ("Blocking waiting for file lock on build
# directory"). Нужна независимая сборка прямо сейчас - задайте свой каталог:
#   CARGO_TARGET_DIR=target/scratch cargo build
[build]
target-dir = "target/precheck"
