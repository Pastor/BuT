<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Takt</title>
<link rel="stylesheet" href="app.css">
</head>
<body class="scheme-host">
<main class="work">
<div data-panel="scheme" class="panel panel-scheme">
      <div id="scheme-notice" class="notice conflict" hidden>
        <span id="scheme-notice-text"></span>
        <button id="scheme-drop" type="button" data-i18n="scheme.staleDrop">убрать</button>
      </div>
      <!-- Строка уровня: путь входа. Кнопки холста стоят не здесь, а панелями
           на самом холсте: их место и видимость выбирает читатель. -->
      <div class="scheme-bar">
        <nav id="crumbs" class="crumbs" data-i18n-attr="aria-label:scheme.level" aria-label="Уровень схемы"></nav>
      </div>
      <div id="stage" class="scheme-stage legend-side-bottom">
        <div id="scheme" class="scheme" tabindex="0" data-i18n-attr="aria-label:scheme.canvas" aria-label="Схема состояний модели">
          <svg id="sheet" class="sheet" role="img"></svg>
          <!-- Возврат на уровень выше: кнопка стоит в углу холста и появляется
               только внутри композиции - на верхнем листе подниматься некуда.
               С листом она не едет: угол принадлежит области, а не рисунку. -->
          <button id="scheme-up" class="icon-btn scheme-up" type="button" hidden
                  data-i18n-attr="aria-label:scheme.up;data-tip:scheme.up" aria-label="Наверх" data-tip="Наверх"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></svg></button>
          <!-- Места панелей: панель тянут за ручку, и она встаёт в одно из
               четырёх мест холста. Имя места лежит в памяти браузера - оно
               принадлежит читателю, а не проекту, и с публикацией не едет. -->
          <div class="tool-dock tool-dock-tl" data-dock="tl">
          <!-- Прогон: пуск, шаг, сброс, остановка и журнал. Схема показывает ход автомата
               подсветкой, и тянуться за пуском в другую область незачем; действие и
               доступность общие с панелью прогона (`data-run`), второго обработчика нет -->
          <div id="panel-run" class="tool-panel scheme-tools" data-tool="run"
               data-i18n-attr="aria-label:scheme.panel.run" aria-label="Прогон">
            <span class="tool-grip" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 6.5v11M14.5 6.5v11"/></svg></span>
            <label for="budget" class="run-steps" data-i18n="trace.budget">Шаги</label>
            <input id="budget" type="number" min="1" max="1000000" value="200"
            data-i18n-attr="data-tip:trace.budgetHint" data-tip="Сколько тактов пускать">
            <label for="tickdelay" class="run-steps" data-i18n="trace.delay">Задержка, с</label>
            <input id="tickdelay" type="number" min="0" max="60" step="0.1" value="0"
            data-i18n-attr="data-tip:trace.delayHint" data-tip="Пауза между тактами прогона, секунд; 0 — без паузы. Своя у каждого сценария">
            <button class="icon-btn" type="button" data-run="run"
            data-i18n-attr="aria-label:trace.run;data-tip:trace.run"
            aria-label="Прогон" data-tip="Прогон"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 5l11 7-11 7z"/></svg></button>
            <button class="icon-btn" type="button" data-run="step"
            data-i18n-attr="aria-label:trace.step;data-tip:trace.step"
            aria-label="Шаг" data-tip="Шаг"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5l10 7-10 7z"/><path d="M18.5 5v14"/></svg></button>
            <button class="icon-btn" type="button" data-run="reset"
            data-i18n-attr="aria-label:trace.reset;data-tip:trace.reset"
            aria-label="Сброс" data-tip="Сброс"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12a8 8 0 1 0 2.3-5.6"/><path d="M4 4v5h5"/></svg></button>
            <button class="icon-btn" type="button" data-run="stop" disabled
            data-i18n-attr="aria-label:trace.stop;data-tip:trace.stop"
            aria-label="Стоп" data-tip="Стоп"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
          </div>
          </div>
          <div class="tool-dock tool-dock-tr" data-dock="tr">
          <!-- Вид листа: масштаб, вписать, к началу, раскладка заново -->
          <div id="panel-view" class="tool-panel scheme-tools" data-tool="view"
               data-i18n-attr="aria-label:scheme.panel.view" aria-label="Вид">
            <span class="tool-grip" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 6.5v11M14.5 6.5v11"/></svg></span>
            <button class="icon-btn" type="button" data-act="zoom-out" data-i18n-attr="aria-label:scheme.zoomOut;data-tip:scheme.zoomOut" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M7.5 10.5h6"/></svg></button>
            <button class="icon-btn" type="button" data-act="zoom-in" data-i18n-attr="aria-label:scheme.zoomIn;data-tip:scheme.zoomIn" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M7.5 10.5h6M10.5 7.5v6"/></svg></button>
            <span id="zoom" class="zoom-value"></span>
            <button class="icon-btn" type="button" data-act="fit" data-i18n-attr="aria-label:scheme.fit;data-tip:scheme.fit" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5"/><path d="M15 4h5v5"/><path d="M20 15v5h-5"/><path d="M9 20H4v-5"/><path d="M9.5 9.5h5v5h-5z"/></svg></button>
            <button class="icon-btn" type="button" data-act="center" data-i18n-attr="aria-label:scheme.center;data-tip:scheme.center" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
            <button class="icon-btn" type="button" data-act="auto" data-i18n-attr="aria-label:scheme.autoLayout;data-tip:scheme.autoLayout" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 3.5h5v4h-5z"/><path d="M3.5 16.5h5v4h-5z"/><path d="M15.5 16.5h5v4h-5z"/><path d="M12 7.5v3M6 16.5V13h12v3.5"/></svg></button>
          </div>
          </div>
          <div class="tool-dock tool-dock-bl" data-dock="bl"></div>
          <div class="tool-dock tool-dock-br" data-dock="br">
          <!-- Работа с листом: место легенды, звено, настройки и навигатор -->
          <div id="panel-sheet" class="tool-panel scheme-tools" data-tool="sheet"
               data-i18n-attr="aria-label:scheme.panel.sheet" aria-label="Лист">
            <span class="tool-grip" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 6.5v11M14.5 6.5v11"/></svg></span>
            <button class="icon-btn" type="button" data-act="legend-bottom" aria-pressed="true" data-i18n-attr="aria-label:scheme.legend.bottom;data-tip:scheme.legend.bottom" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 3.5h17v10h-17z"/><path d="M3.5 16h17v4.5h-17z"/></svg></button>
            <button class="icon-btn" type="button" data-act="legend-right" aria-pressed="false" data-i18n-attr="aria-label:scheme.legend.right;data-tip:scheme.legend.right" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 3.5h11v17h-11z"/><path d="M17 3.5h3.5v17H17z"/></svg></button>
            <button class="icon-btn" type="button" data-act="legend-float" aria-pressed="false" data-i18n-attr="aria-label:scheme.legend.float;data-tip:scheme.legend.float" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 3.5h17v17h-17z"/><path d="M8.5 8.5h9v6h-9z"/></svg></button>
            <button class="icon-btn" type="button" data-act="pin-add" data-i18n-attr="aria-label:scheme.pinAdd;data-tip:scheme.pinAdd" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20v-8h8"/><circle cx="12" cy="12" r="2.5"/><path d="M16.5 6.5h5M19 4v5"/></svg></button>
            <button class="icon-btn" type="button" data-act="nav" aria-pressed="false" data-i18n-attr="aria-label:scheme.navigator;data-tip:scheme.navigatorHint" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 4.5h17v15h-17z"/><path d="M9 4.5v15"/><path d="M12 9h6M12 12h6M12 15h4"/></svg></button>
          </div>
          </div>
          <div id="nav" class="scheme-nav" hidden></div>
          <svg id="map" class="minimap" viewBox="0 0 128 96" role="img" data-i18n-attr="aria-label:scheme.minimap" aria-label="Миникарта листа"></svg>
          <div id="scheme-empty" class="sheet-empty" data-i18n="scheme.empty" hidden>Схема появится, когда модель разберётся</div>
        </div>
        <!-- Границу легенды тянут мышью: сколько её видно, решает автор. Полке
             принадлежит высота, колонке - ширина, и это две разные оси - у
             разделителя ось задаётся при подключении, поэтому их двое. -->
        <div id="legendrows" class="split split-h" role="separator" aria-orientation="horizontal"
             data-i18n-attr="aria-label:scheme.legend.rows" aria-label="Высота легенды" tabindex="0"></div>
        <div id="legendcols" class="split split-v" role="separator" aria-orientation="vertical"
             data-i18n-attr="aria-label:scheme.legend.cols" aria-label="Ширина легенды" tabindex="0"></div>
        <div id="legend" class="legend legend-bottom" data-i18n-attr="aria-label:scheme.legend" aria-label="Легенда обозначений"></div>
      </div>
    </div>
</main>
<div id="scheme-modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true"
       data-i18n-attr="aria-label:settings.title" aria-label="Настройки">
    <div class="modal-head" data-i18n="settings.title">Настройки</div>
    <div id="scheme-tabs" class="tabs" role="tablist"></div>
    <div id="scheme-settings" class="modal-body settings-body"></div>
    <div class="modal-foot">
      <button id="scheme-cancel" type="button" data-i18n="scheme.settingsCancel">Отменить</button>
      <button id="scheme-save" type="button" class="primary" data-i18n="scheme.settingsSave">Сохранить</button>
    </div>
  </div>
</div>

<script type="module" src="scheme-host-boot.js"></script>
</body>
</html>
