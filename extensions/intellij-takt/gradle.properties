# Координаты и версии плагина IntelliJ для Takt.
# Диапазон совместимости IDE и версия платформы вынесены сюда.
pluginGroup = org.takt
pluginVersion = 0.7.0

# IntelliJ Platform: IC = IntelliJ IDEA Community (семантическая подсветка через
# LSP4IJ не требует Ultimate - в этом смысл проекта LSP4IJ).
# Линейка 2024.2.x (build 242) - минимум, поддерживаемый современным LSP4IJ
# (0.19+ требуют sinceBuild 242); требует JDK 21, который toolchain
# авто-провизионирует (foojay-резолвер в settings.gradle.kts). пересмотр ADR
# Драйвер 1 (Community/JDK17/2024.1) изменён - LSP4IJ уронил поддержку 241,
# и без подъёма платформы семантический слой невозможен. Community сохранён.
platformType = IC
platformVersion = 2024.2.5

# Нижняя граница сборок IDE - 242: её требует LSP4IJ (опциональная зависимость).
# Верхняя граница не задаётся (открытый диапазон): плагин совместим
# с новыми IDE. Пустое `pluginUntilBuild` убирает атрибут until-build.
pluginSinceBuild = 242
pluginUntilBuild =

# Стабильность/производительность Gradle.
org.gradle.configuration-cache = true
org.gradle.caching = true
kotlin.stdlib.default.dependency = false
