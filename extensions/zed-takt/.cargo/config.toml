# Каталог сборки расширения - переопределение корневого
# `.cargo/config.toml`, который уводит весь кэш в `target/precheck`.
#
# Zed ищет артефакт по фиксированному пути внутри каталога расширения:
# `target/<таргет>/release/<crate>.wasm`. Cargo же берёт ближайший вверх по
# дереву конфиг, и корневой действует здесь тоже - собранный wasm уезжал в
# `<repo>/target/precheck/...`, где чужой инструмент его не ищет. Замер
# 2026-08-23: сборка проходит, файл на месте, установка падает.
#
# Довод "весь кэш под присмотр самоочистки" на расширение не
# распространяется: это отдельный workspace вне `precheck.sh`, собирает его
# Zed, и объём кэша - единицы мегабайт. Тем же приёмом живёт
# `scripts/install.sh` (свой `target/install`).
[build]
target-dir = "target"
