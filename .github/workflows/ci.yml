on: [ push ]

name: build

# Единый барьер: CI прогоняет весь scripts/precheck.sh под строгим
# режимом. Логики проверок в этом workflow нет - только установка инструментов и
# один вызов скрипта. Причина: своя реализация проверок в CI рядом
# с precheck.sh даёт два расходящихся источника. Источник один: проверка,
# добавленный в precheck.sh, автоматически идёт и в CI без правки этого файла.
# ADR: docs/adr/0090-ci-precheck.md.

jobs:
  ubuntu:
    name: Ubuntu — полный precheck.sh (строгий режим)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 - полный клон С тегами. По умолчанию
      # actions/checkout берёт один коммит и тегов не выкачивает, а проверка метки
      # версии под PRECHECK_STRICT=1 требует их наличия: без тегов пропуск тега
      # неотличим от невыкачанных тегов. Задание windows правки не требует - оно
      # гоняет только cargo test, без precheck.sh.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Толчейн не задаётся здесь: он зафиксирован в `rust-toolchain.toml`
      # и rustup на раннере ставит именно его - вместе с
      # компонентами rustfmt и clippy, перечисленными в том же файле. Так версия
      # компилятора описана в одном месте: дублировать её в workflow значит
      # завести второй источник истины, который разойдётся с первым.
      - name: Toolchain (пин из rust-toolchain.toml)
        run: rustup show active-toolchain && cargo --version && cargo fmt --version

      # Инструменты живых проверок precheck.sh. python3, cc/gcc и git - уже на
      # образе ubuntu-latest. bison >= 2.4 + flex - для сборки MatIEC iec2c
      # (ubuntu несёт bison 3.x; на macOS системный 2.3 сборку валит).
      - name: Системные инструменты гейтов
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build verilator yosys \
            bison flex build-essential
          cmake --version | head -1
          ninja --version
          verilator --version | head -1
          yosys -V | head -1
          bison --version | head -1

      # Арбитр ST: собирается из исходников (лицензия открытая). Скрипт сам по
      # себе не валит сборку; строгость обеспечивает проверка ST в precheck.sh под
      # PRECHECK_STRICT=1 (нет iec2c -> ошибка, а не мягкий пропуск).
      - name: Сборка арбитра ST (MatIEC iec2c)
        run: ./scripts/ensure-iec2c.sh

      # PRECHECK_STRICT=1: в CI отсутствие любого инструмента проверки - ошибка, а не
      # пропуск (пропущенная проверка зелена, то есть неотличима от пройденной -
      # с чужими инструментами). SV_GATE_REQUIRED наследует этот флаг внутри скрипта.
      # Под строгим режимом формат проверяется (`fmt --check`), а не применяется.
      - name: precheck.sh (fmt-check + линты + тесты + живые гейты всех целей)
        env:
          PRECHECK_STRICT: 1
        run: ./scripts/precheck.sh

  # Windows - узкая проверка портируемости Rust-тестов. Job гоняет
  # `cargo test`, а не весь precheck.sh. Отступление от правила "логика
  # проверок только в precheck.sh") осознанное: цель - доказать, что шесть
  # тестов (5 разбора `-I` в taktc + 1 `viewport`) работают на Windows, а не
  # прогнать аппаратные проверки C, SV и ST - verilator, yosys и iec2c на windows-latest
  # неподъёмны и к портируемости Rust-тестов отношения не имеют. Полный precheck
  # на Windows - вопрос отдельной фичи.
  #
  # continue-on-error: job неблокирующий, пока Windows не разобран -
  # иначе первый прогон, полный ещё не расклассифицированных чужих падений
  # (аппаратные тесты без инструментов), завалил бы весь CI. Флаг снимается
  # отдельным коммитом после первого зелёного прогона - до тех пор
  # работа над Windows в готово не переводится.
  #
  # CI Actions в проекте заблокирован по биллингу: job добавлен
  # готовым, но пока не исполняется, поэтому его условия остаются непроверёнными.
  windows:
    name: Windows — cargo test (портируемость, фича 0037)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Толчейн - из `rust-toolchain.toml`, см. комментарий выше.
      - name: Toolchain (пин из rust-toolchain.toml)
        run: rustup show active-toolchain && cargo --version

      # Параллельно - как в предкоммите. Флаг `--test-threads=1` здесь не нужен:
      # `--test-threads=1` с объяснением "как требуют CLAUDE.md и precheck.sh",
      # но флаг снят: однопоточность держалась не на природе тестов,
      # а на двух строках в `st_tests`, где временный каталог строился по
      # фикстуре, а не по тесту. Комментарий утверждал снятое правило, то есть
      # обещал согласие с предкоммитом там, где его не было.
      #
      # Ключ уникальности временного каталога - имя потока:
      # в однопоточном режиме имени нет, и ключом остаётся фикстура. То есть
      # прежний флаг не усиливал изоляцию, а ослаблял её - просто гонка не
      # успевала проявиться.
      #
      # Прогоном это не проверено: задания Actions не стартуют (биллинг,
      # Правка приводит CI к правилу проекта, а не к замеру.
      - name: cargo test (все фичи)
        run: cargo test --all-features
