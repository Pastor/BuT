[package]
name = "takt-sim"
version = "0.15.0"
authors = ["Pastor <viruszold@gmail.com>"]
description = "Takt — учебный DSL конечных автоматов: симулятор моделей. Язык сделан в учебных целях и показывает принципы автоматного подхода к разработке"
homepage = "https://but.ru"
repository = "https://github.com/Pastor/Takt"
readme = "../README.md"
keywords = ["Takt", "framework", "simulation"]
license = "BSD"
edition = "2024"
# MSRV: проверено на пине толчейна (rust-toolchain.toml). Нижняя граница
# специально не исследовалась - объявлена та версия, на которой гоняются проверки.
rust-version = "1.97"
include = ["Cargo.toml", "src/**/*", "README.md", "LICENSE*"]

# Бенчмарки идут через criterion, у которого свой harness. Без
# `bench = false` cargo пытается прогнать как бенч и библиотеку с бинарниками -
# их стандартный harness не понимает флагов criterion (`--quick`, `--baseline`).
[lib]
bench = false

# CLI требует графики: `-o` пишет GIF прогона, и без растеризатора ключ не
# имел бы смысла. Библиотека без графики - для потребителя, который рисует
# кадры сам (модуль WebAssembly зовёт крейт рисунка напрямую).
[[bin]]
name = "takt-sim"
bench = false
path = "src/bin/takt_sim.rs"
required-features = ["graphics"]

[dependencies]
takt-lang = { path = "../takt-lang" }
log = "0.4.29"
# Кадры прогона - чертёж листа по файлу раскладки: рисунок, растр и видео у
# эталона те же, что у страницы.
takt-scheme = { path = "../takt-scheme", features = ["video"], optional = true }
# Проект на диске: состав, роды файлов, активные файлы - то, что экспорт
# выгружает и что печатает `takt-sim project`.
takt-project = { path = "../takt-project", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
# Чтение GIF прогона обратно: число кадров - число тактов.
gif = "0.14.2"

# Бенчмарк симуляции. См. комментарий в takt-lang/Cargo.toml.
[[bench]]
name = "simulate"
harness = false

[features]
default = ["graphics"]
# Кадры прогона: такт эталона рисуется чертежом листа по файлу раскладки
# `.takt-ui` и кодируется в GIF крейтом рисунка.
#
# Выключается не ради веса, а ради переносимости: модуль WebAssembly исполняет
# модель без неё и рисует кадры, зовя крейт рисунка сам. Умолчание оставлено
# включённым: прежние потребители не замечают фичи вовсе.
graphics = ["dep:takt-scheme", "dep:takt-project"]
