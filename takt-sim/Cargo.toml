[package]
name = "takt-sim"
version = "0.14.0"
authors = ["Pastor <viruszold@gmail.com>"]
description = "Takt — учебный DSL конечных автоматов: симулятор моделей. Язык сделан в учебных целях и показывает принципы автоматного подхода к разработке"
homepage = "https://but.ru"
repository = "https://github.com/Pastor/Takt"
readme = "../README.md"
keywords = ["Takt", "framework", "simulation"]
license = "BSD"
edition = "2024"
# MSRV: проверено на пине толчейна (rust-toolchain.toml). Нижняя граница
# специально не исследовалась - объявлена та версия, на которой гоняются гейты.
rust-version = "1.97"
include = ["Cargo.toml", "src/**/*", "README.md", "LICENSE*"]

# Бенчмарки идут через criterion, у которого свой harness. Без
# `bench = false` cargo пытается прогнать как бенч и библиотеку с бинарниками -
# их стандартный harness не понимает флагов criterion (`--quick`, `--baseline`).
[lib]
bench = false

# CLI требует графики: он умеет писать GIF и SVG, и без них половина его
# ключей не имела бы смысла. Библиотека без графики - для
# потребителя без файловой системы и без растеризатора (модуль WebAssembly).
[[bin]]
name = "takt-sim"
bench = false
path = "src/bin/takt_sim.rs"
required-features = ["graphics"]

[dependencies]
takt-lang = { path = "../takt-lang" }
log = "0.4.29"
svg = { version = "0.18.0", optional = true }
petgraph = { version = "0.8.3", optional = true }
rand = { version = "0.10.1", optional = true }
rand_distr = { version = "0.6.0", optional = true }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = { version = "0.47.0", optional = true }
base64 = { version = "0.23.0", optional = true }
gif = { version = "0.14.2", optional = true }
env_logger = "0.11"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

# Бенчмарк симуляции. См. комментарий в takt-lang/Cargo.toml.
[[bench]]
name = "simulate"
harness = false

[features]
default = ["graphics"]
# Визуализация прогона: раскладка графа, SVG-кадры, GIF-запись.
#
# Выключается не ради веса, а ради переносимости: растеризатор и файловая
# система есть не у всякого потребителя эталона - модуль WebAssembly (фича
# 0531) исполняет модель в браузере, где нет ни того, ни другого. Умолчание
# оставлено включённым: прежние потребители не замечают фичи вовсе.
graphics = ["dep:svg", "dep:petgraph", "dep:rand", "dep:rand_distr", "dep:resvg", "dep:base64", "dep:gif"]
