[package]
name = "takt-wasm-export"
version = "0.1.0"
authors = ["Pastor <viruszold@gmail.com>"]
description = "Takt — учебный DSL конечных автоматов: модуль экспорта для WebAssembly — картинки листов схемы и видео прогона"
homepage = "https://but.ru"
repository = "https://github.com/Pastor/Takt"
readme = "../README.md"
keywords = ["Takt", "wasm", "webassembly"]
license = "BSD"
edition = "2024"
# MSRV: проверено на пине толчейна (rust-toolchain.toml), как у соседних крейтов.
rust-version = "1.97"
include = ["Cargo.toml", "src/**/*", "README.md", "LICENSE*"]

# `cdylib` - модуль для браузера, `rlib` - та же логика для родных тестов.
[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[dependencies]
# Протокол обмена со страницей - общий с ядром.
takt-wasm-io = { path = "../takt-wasm-io" }
# Эталон с графикой: экспорт идёт тем же носителем, что у `takt-sim export`;
# файловой системы экспорт не касается.
takt-sim = { path = "../takt-sim", default-features = false, features = ["graphics"] }
# Рисунок в числах для сверки паритета с холстом, растр и видео.
takt-scheme = { path = "../takt-scheme", features = ["video"] }
# Проект из состава запроса: род файла по расширению.
takt-project = { path = "../takt-project" }
takt-lang = { path = "../takt-lang" }
# Байты картинок и видео едут в ответе строкой base64.
base64 = "0.22.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
