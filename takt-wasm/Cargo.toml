[package]
name = "takt-wasm"
version = "0.3.0"
authors = ["Pastor <viruszold@gmail.com>"]
description = "Takt — учебный DSL конечных автоматов: привязки компилятора, слоя LSP и эталона для WebAssembly"
homepage = "https://but.ru"
repository = "https://github.com/Pastor/Takt"
readme = "../README.md"
keywords = ["Takt", "wasm", "webassembly"]
license = "BSD"
edition = "2024"
# MSRV: проверено на пине толчейна (rust-toolchain.toml), как у соседних крейтов.
rust-version = "1.97"
include = ["Cargo.toml", "src/**/*", "README.md", "LICENSE*"]

# `cdylib` - модуль для браузера, `rlib` - та же логика для родных тестов. Без
# второго типа мост проверялся бы только из браузера, то есть на глаз: `cargo test`
# линкует `rlib`, а `wasm32-unknown-unknown` берёт `cdylib`.
[lib]
crate-type = ["cdylib", "rlib"]
bench = false

[dependencies]
# Слой LSP нужен целиком: подсветка, наведение, переход, использования,
# переименование и форматирование в браузере идут через `takt_lang::lsp`: своего
# списка ключевых слов у веб-части нет и быть не должно.
takt-lang = { path = "../takt-lang", features = ["lsp"] }
# Схема вне страницы: рисунок в числах для сверки с холстом, позже - чертёж.
takt-scheme = { path = "../takt-scheme" }
# Эталон без графики: растеризатора и файловой системы в браузере нет.
takt-sim = { path = "../takt-sim", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
