[package]
name = "takt-lang"
version = "0.60.0"
authors = ["Pastor <viruszold@gmail.com>"]
description = "Takt — учебный DSL конечных автоматов: компилятор и LSP-сервер. Язык сделан в учебных целях и показывает принципы автоматного подхода к разработке"
homepage = "https://but.ru"
repository = "https://github.com/Pastor/Takt"
readme = "../README.md"
keywords = ["Takt", "framework", "code", "generation"]
license = "BSD"
edition = "2024"
# MSRV: проверено на пине толчейна (rust-toolchain.toml). Нижняя граница
# специально не исследовалась - объявлена та версия, на которой гоняются проверки.
rust-version = "1.97"
exclude = ["src/grammar.lalrpop"]
include = ["Cargo.toml", "src/**/*", "src/ast.rs", "README.md", "LICENSE*"]

# Бенчмарки идут через criterion, у которого свой harness. Без
# `bench = false` cargo пытается прогнать как бенч и библиотеку с бинарниками -
# их стандартный harness не понимает флагов criterion (`--quick`, `--baseline`).
[lib]
bench = false

[[bin]]
name = "taktc"
bench = false
path = "src/bin/taktc.rs"

[[bin]]
name = "takt-lsp"
bench = false
path = "src/bin/takt_lsp.rs"
required-features = ["lsp"]

[build-dependencies]
lalrpop = { git = "https://github.com/lalrpop/lalrpop.git", version = "^0.23.1", features = ["lexer"] }

[dependencies]
lalrpop-util = { git = "https://github.com/lalrpop/lalrpop.git", version = "^0.23.1" }
thiserror = "2.0.18"
phf = { version = "0.14.0", features = ["macros"] }
unicode-xid = "0.2"
itertools = "0.15.0"
serde = { version = "^1.0", features = ["derive"], optional = true }
log = "0.4.29"
serde_json = { version = "1", optional = true }
lsp-server = { version = "0.10.0", optional = true }
lsp-types = { version = "0.97", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde_json = "1.0.149"
tempfile = "3"

# Бенчмарки: меряют функции, а не время процесса. Не подключены к
# `precheck.sh` и порога не имеют - время на общей машине шумит, и проверка,
# которому не верят, хуже отсутствующего (решение проекта).
[[bench]]
name = "compile"
harness = false

[[bench]]
name = "verify"
harness = false

[features]
default = []
ast-serde = ["serde"]
lsp = ["dep:serde_json", "dep:lsp-server", "dep:lsp-types"]
