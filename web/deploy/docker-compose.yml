# Стенд сервиса проектов Takt.
#
# Две службы: PostgreSQL и сервер. nginx сюда не входит - на стенде он общий и
# ставится отдельно (шаблон рядом, `nginx.conf.template`): держать свой прокси в
# каждом стеке значит спорить за 80-й порт.
#
# Пароля в дереве нет: он приходит файлом окружения (`.env` рядом, в
# `.gitignore`). Умолчания годятся только для своей машины и названы так, чтобы
# это бросалось в глаза.

# Имя проекта задано явно. Без него `docker compose` берёт имя каталога -
# `deploy`, - и стек Takt столкнулся бы с любым другим стеком, лежащим в
# каталоге с тем же именем: тома `deploy_db` и контейнеры `deploy-server-1`
# делятся между ними молча. На стенде рядом живёт другой сервис (tamagotchi),
# и имена томов обязаны быть различимы.
name: takt

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-takt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-пароль-для-своей-машины-не-для-стенда}
      POSTGRES_DB: ${POSTGRES_DB:-takt_web}
      # Локаль UTF-8 обязательна: при `C` кириллица не приводится к нижнему
      # регистру, и поиск по витрине молча перестаёт находить.
      LANG: C.UTF-8
      POSTGRES_INITDB_ARGS: "--locale=C.UTF-8 --encoding=UTF8"
    # Порт базы наружу не публикуется: на стенде 5432 уже занят соседним
    # сервисом, а сервер ходит в базу по внутренней сети стека. Публиковать
    # его - значит спорить за порт ни за чем.
    # Том монтируется в `/var/lib/postgresql`, а не в `.../data`: образ 18+
    # раскладывает данные по подкаталогу с номером версии, и при монтировании в
    # `data` он отказывается стартовать вовсе ("there appears to be PostgreSQL
    # data in /var/lib/postgresql/data (unused mount/volume)").
    volumes:
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-takt} -d ${POSTGRES_DB:-takt_web}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ../..
      dockerfile: web/deploy/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Значения В кавычках: внутри них есть двоеточие с пробелом (в адресе
      # базы и в тексте отказа), а без кавычек YAML читает такую строку как
      # отображение - `docker compose` отвечает "mapping values are not allowed
      # in this context" и стек не поднимается вовсе. Нашлось выкладкой на
      # стенд 2026-09-05: дома стек не поднимали ни разу.
      TAKT_WEB_DB: "postgresql://${POSTGRES_USER:-takt}:${POSTGRES_PASSWORD:-пароль-для-своей-машины-не-для-стенда}@db/${POSTGRES_DB:-takt_web}"
      TAKT_WEB_JWT_SECRET: "${TAKT_WEB_JWT_SECRET:?задайте секрет подписи: с умолчанием токен подпишет кто угодно}"
      TAKT_WEB_BASE_PATH: ${TAKT_WEB_BASE_PATH:-/}
      TAKT_WEB_RETENTION_DAYS: ${TAKT_WEB_RETENTION_DAYS:-90}
    ports:
      - "${TAKT_WEB_BIND:-127.0.0.1:8730}:8730"
    volumes:
      - projects:/srv/takt/projects

volumes:
  db:
  projects:
