<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!-- Корень адресов страницы. Обязателен: живая страница проекта стоит по
     адресу `/p/<id>`, и относительная ссылка на бандл считалась бы ОТ НЕЁ —
     `/p/b/<отпечаток>/app.css`. Хуже того, такой адрес отвечает `200`
     страницей-заглушкой, и вкладка открывается без стилей и без модуля, ничего
     не сообщая (нашлось прогоном страницы 2026-09-04, задача 0531-09c).
     За обратным прокси значение переписывает сервер — префикс знает он. -->
<base href="/">
<!-- `viewport-fit=cover` обязателен: без него `env(safe-area-inset-*)` равен
     нулю в браузере телефона, и полка режимов встаёт под зоной жестов
     (замер референса 2026-09-04 — у него эта половина не работает). -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="page.title">Takt</title>
<meta name="description" content="Редактор языка Takt: подсветка, диагностики, генерация кода для восьми целей и прогон модели — всё в браузере.">
<meta name="theme-color" content="#1b1f24">
<!-- Предпросмотр ссылки: ею и делятся. -->
<meta property="og:title" content="Takt">
<meta property="og:description" content="Модель на Takt: написать, проверить, собрать под восемь целей и прогнать — в браузере.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body data-mode="source">
<!-- Системные сообщения: сбои инструмента (модуль не загружен, отказ запроса,
     необработанное исключение). Стоят поверх страницы сверху, потому что застают
     автора в любой из областей; замечания к модели сюда не попадают - у них своя
     область. Узлы строит `alerts.js` построением, а не разметкой из данных:
     текст приходит от чужого источника. -->
<div id="alerts" class="alerts" aria-live="assertive"></div>
<!-- Шапка из двух полос: наверху - кто мы и
     что за сборка, плюс вход; ниже — управление. Полосы разведены потому, что
     это разные вопросы читателя: «что за страница» и «что я могу сделать». -->
<header class="bar bar-brand">
  <span class="brand">Takt</span>
  <span id="version" class="muted" data-i18n="bar.loading">загрузка модуля…</span>
  <!-- Чей образец открыт: страница `/p/<id>` показывает чужой проект, и
       читатель обязан видеть автора — иначе чужая модель выглядит его
       собственной работой (задача 0531-09c). -->
  <span id="project" class="muted" hidden></span>
  <!-- Что открыто: проект, файл и ревизия. Без ревизии "сохранено" ничего не
       значит — автор не отличит свою запись от чужой (задача 0531-09e). -->
  <span id="openfile" class="muted" hidden></span>
  <span class="spacer"></span>
  <!-- Логин показывается подписью рядом, а не в кнопке: кнопка-значок текста не
       несёт, а знать, кто вошёл, читателю надо. -->
  <span id="whoami-bar" class="muted" hidden></span>
  <!-- Вход и выход - одна кнопка: состояние у них одно, и две кнопки, из
       которых всегда видна одна, читателю ничего не добавляют. Значок меняется
       вместе с действием: не вошёл — стрелка внутрь, вошёл — наружу. -->
  <!-- Переключатель языка - рядом со входом и размером с кнопку: в списке
       самоназвания («Русский», «English»), на кнопке — код языка (задача
       0531-09l, решение заказчика). Самоназвания НЕ переводятся: так читатель
       находит свой язык, не зная текущего. -->
  <select id="lang" class="lang" data-i18n-attr="aria-label:bar.language"></select>
  <button id="session" class="icon-btn" type="button"
          data-i18n-attr="data-tip:account.enter;aria-label:account.enter"
          data-tip="Войти" aria-label="Войти"><svg id="icon-enter" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14 4.5h4.5v15H14"/><path d="M9.5 8l4 4-4 4"/><path d="M13.5 12H3.5"/></svg><svg id="icon-leave" class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" hidden><path d="M13.5 4.5H5.5v15h8"/><path d="M17 8l4 4-4 4"/><path d="M21 12h-8.5"/></svg></button>
</header>

<div class="bar bar-tools">
  <button id="account" class="icon-btn" type="button"
          data-i18n-attr="data-tip:account.projects;aria-label:account.projects"
          data-tip="Мои проекты" aria-label="Мои проекты"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="9.5" r="2.5"/><path d="M6.5 19c1-2.5 3-3.8 5.5-3.8s4.5 1.3 5.5 3.8"/></svg></button>
  <button id="showcase" class="icon-btn" type="button"
          data-i18n-attr="data-tip:showcase.title;aria-label:showcase.title"
          data-tip="Открытые проекты" aria-label="Открытые проекты"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 5.5h7v7h-7zM13.5 5.5h7v7h-7zM3.5 15.5h7v5h-7zM13.5 15.5h7v5h-7z"/></svg></button>
  <button id="save" class="icon-btn" type="button" hidden
          data-i18n-attr="data-tip:account.save;aria-label:account.save"
          data-tip="Сохранить" aria-label="Сохранить"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3.5v10"/><path d="M8 10l4 4 4-4"/><path d="M4.5 16v4.5h15V16"/></svg></button>
  <button id="format" class="icon-btn" type="button"
          data-i18n-attr="data-tip:bar.format;aria-label:bar.format"
          data-tip="Формат" aria-label="Формат"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16M4 12h16M4 19h16"/><path d="M8 8.5 5.5 12 8 15.5"/></svg></button>
  <!-- Перенос длинных строк - одна залипающая кнопка на все области кода:
       исходник, вывод цели, сценарий и трассу (решение заказчика). Нажатое
       состояние видно (`aria-pressed`), иначе кнопка ничего не сообщает. -->
  <button id="wrap" class="icon-btn" type="button" aria-pressed="false"
          data-i18n-attr="data-tip:bar.wrap;aria-label:bar.wrap"
          data-tip="Переносить длинные строки" aria-label="Переносить длинные строки"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6.5h16"/><path d="M4 12h12.5a3.5 3.5 0 0 1 0 7H9.5"/><path d="M12.5 16.5 9.5 19l3 2.5"/></svg></button>
  <button id="share" class="icon-btn" type="button"
          data-i18n-attr="data-tip:bar.share;aria-label:bar.share"
          data-tip="Поделиться" aria-label="Поделиться"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="6.5" cy="12" r="2.5"/><circle cx="17.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/><path d="M8.8 10.8 15.2 7.7M8.8 13.2l6.4 3.1"/></svg></button>
  <button id="download" class="icon-btn" type="button" hidden
          data-i18n-attr="data-tip:archive.download;aria-label:archive.download"
          data-tip="Скачать архивом" aria-label="Скачать архивом"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 4.5h17v4h-17z"/><path d="M5 8.5v11h14v-11"/><path d="M10 12h4"/></svg></button>
  <!-- Кегль страницы: ±1 к корневому размеру. Все ступени шкалы считаются от
       него, поэтому меняется страница целиком — и код, и контролы. -->
  <span class="pane-tools">
    <button id="fontless" class="chip" type="button"
            data-i18n="bar.fontLess" data-i18n-attr="data-tip:bar.fontHint" data-tip="Мельче">−</button>
    <span id="fontsize" class="status" aria-live="polite"></span>
    <button id="fontmore" class="chip" type="button"
            data-i18n="bar.fontMore" data-i18n-attr="data-tip:bar.fontHint" data-tip="Крупнее">+</button>
  </span>
  <span class="spacer"></span>
  <!-- Панели правой области: генерация либо симуляция, либо ни одной. Кнопки
       залипающие и взаимоисключающие — область одна, и держать в ней два
       ответа сразу негде (решение заказчика 2026-09-05). -->
  <button id="showgen" class="icon-btn" type="button" aria-pressed="true"
          data-i18n-attr="data-tip:panel.generate;aria-label:panel.generate"
          data-tip="Генерация" aria-label="Генерация"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 8.5 4.5 12 9 15.5"/><path d="M15 8.5 19.5 12 15 15.5"/></svg></button>
  <button id="showsim" class="icon-btn" type="button" aria-pressed="false"
          data-i18n-attr="data-tip:panel.simulate;aria-label:panel.simulate"
          data-tip="Симуляция" aria-label="Симуляция"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 16h3v-8h5v8h5v-8h4"/></svg></button>
  <!-- Схема состояний: третья панель той же области. Что рисовать, говорит
       модуль (граф модели), где - файл раскладки автора рядом с моделью. -->
  <button id="showscheme" class="icon-btn" type="button" aria-pressed="false"
          data-i18n-attr="data-tip:panel.scheme;aria-label:panel.scheme"
          data-tip="Схема" aria-label="Схема"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="18" r="3"/><path d="M12 9v3M12 12l-4.5 4M12 12l4.5 4"/></svg></button>
  <!-- Строка "доступна новая сборка": ненавязчиво, без окна и без повтора.
       Молча не перезагружаемся никогда — в редакторе несохранённая работа
       (задача 0531-07b). -->
  <button id="update" class="update" type="button" data-i18n="bar.update" hidden>доступна новая сборка — обновить</button>
</div>

<main class="work">
  <section class="pane pane-source">
    <div class="pane-head">
      <!-- Подпись области зависит от рода открытого файла:
           модель, пояснение или сценарий. Ключ словаря меняет страница —
           текстом здесь она завела бы второй словарь. -->
      <span id="sourcetitle" data-i18n="source.title">Модель</span>
      <span id="openfilename" class="muted"></span>
      <!-- Перенос строк - настройка узкой области: сузив её разделителем,
           читатель теряет правый край строки, и вернуть его надо не мышью по
           горизонтальной прокрутке, а переключателем. Своя у каждой области:
           узкой бывает то одна, то другая. -->
      <span class="pane-tools">
        <span id="status" class="status"></span>
      </span>
    </div>

    <!-- Панель учётной записи и проектов. Скрыта, пока её не позвали: без
         входа страница работает как прежде (проработка §5). -->
    <div id="panel" class="account" hidden>
      <div id="signedin" class="controls" hidden>
        <span id="whoami" class="muted"></span>
        <button id="signout" type="button" data-i18n="account.signOut">Выйти</button>
        <input id="newname" type="text" spellcheck="false"
               data-i18n-attr="placeholder:account.newName" placeholder="Имя нового проекта">
        <button id="newproject" type="button" data-i18n="account.newProject">Новый проект</button>
      </div>
      <div id="profile" class="controls" hidden>
        <span data-i18n="profile.title">Способы входа</span>
        <input id="newpass" type="password" autocomplete="new-password"
               data-i18n-attr="placeholder:profile.newPassword" placeholder="Пароль, если его нет">
        <button id="setpass" type="button" data-i18n="profile.setPassword">Задать пароль</button>
      </div>
      <!-- Связанные площадки: строка - это и есть кнопка отвязки. -->
      <div id="links" class="list" data-i18n-attr="aria-label:profile.title"
           aria-label="Способы входа"></div>
      <div id="projects" class="list" data-i18n-attr="aria-label:account.projects"
           aria-label="Мои проекты"></div>
      <div id="files" class="list" data-i18n-attr="aria-label:account.files"
           aria-label="Файлы проекта"></div>

      <!-- Архив проекта: выгрузка запросом (у закрытого нужен токен, а ссылка
           заголовков не несёт) и загрузка обычным выбором файла. -->
      <!-- Загрузка архива заводит проект, значит требует входа, - и живёт в
           панели. Скачивание же — действие над открытым проектом, доступное
           всякому, кто его видит: его место в шапке, рядом с «Поделиться»
           (нашлось прогоном страницы — в панели читатель его не искал бы). -->
      <div class="controls">
        <label for="upload" data-i18n="archive.upload">Загрузить архив</label>
        <input id="upload" type="file" accept=".zip,application/zip">
      </div>
    </div>

    <!-- Витрина открытых проектов: она и есть обещанное "выложить на всеобщее
         обозрение». Токена не требует. -->
    <div id="finder" class="account" hidden>
      <div class="controls">
        <input id="query" type="text" spellcheck="false"
               data-i18n-attr="placeholder:showcase.query" placeholder="Поиск по открытым проектам">
        <button id="findbtn" type="button" data-i18n="showcase.find">Найти</button>
      </div>
      <div id="found" class="list" data-i18n-attr="aria-label:showcase.title"
           aria-label="Открытые проекты"></div>
      <!-- "Ещё" - постраничность витрины: курсор даёт сервер, страница только
           просит им следующую. Кнопки нет, пока сервер не сказал, что
           продолжение есть. -->
      <div class="controls">
        <button id="more" type="button" data-i18n="showcase.more" hidden>Ещё</button>
      </div>
    </div>

    <!-- Конфликт: обе стороны названы числами и датой, выбор делает автор.
         Молчаливого выбора нет ни в одну сторону. -->
    <div id="conflict" class="notice conflict" hidden>
      <span id="conflicttext"></span>
      <button id="reread" type="button" data-i18n="account.reread">Перечитать</button>
      <button id="overwrite" type="button" data-i18n="account.overwrite">Перезаписать</button>
    </div>
    <div id="editor" class="editor" data-i18n-attr="aria-label:source.editor" aria-label="Исходный текст модели"></div>
    <!-- Разделитель рядов: сколько отдано редактору, сколько диагностикам.
         Правила те же, что у разделителя колонок, ось другая. -->
    <div id="hsplit" class="split split-h" role="separator" aria-orientation="horizontal"
         data-i18n-attr="aria-label:bar.rows" aria-label="Высота диагностик" tabindex="0"></div>
    <div class="pane-head"><span data-i18n="diagnostics.title">Диагностики</span></div>
    <!-- Строка-граница: до фичи сообщения инструментов существуют только
           по-русски, и при другом языке оболочки смешение НАЗЫВАЕТСЯ, а не
           прячется (задача 0531-10a). -->
      <div id="tools-lang" class="notice" data-i18n="tools.russianOnly" hidden>Сообщения инструментов пока только на русском</div>
      <div id="diagnostics" class="list" aria-live="polite"></div>
  </section>


  <!-- Разделитель областей: доли задаёт читатель, как и ширину оболочки.
       Клавиатура обязательна — разделитель без неё недоступен вовсе. -->
  <div id="split" class="split" role="separator" aria-orientation="vertical"
       data-i18n-attr="aria-label:bar.split" aria-label="Ширина областей" tabindex="0"></div>
  <section class="pane pane-result">
    <nav id="tabs" class="tabs" role="tablist">
      <button class="tab active" data-tab="output" role="tab" aria-selected="true" type="button" data-i18n="tabs.output">Вывод цели</button>
      <button class="tab" data-tab="flags" role="tab" aria-selected="false" type="button" data-i18n="tabs.flags">Ключи сборки</button>
    </nav>

    <div data-panel="output" class="panel">
      <div class="controls">
        <label for="target" data-i18n="output.target">Цель</label>
        <select id="target"></select>
        <!-- Поле ключей с экрана убрано: их
             задаёт вкладка «Ключи сборки». Узел остаётся носителем СТРОКИ —
             величина одна, и конструктор пишет именно в неё. -->
        <input id="args" type="hidden" value="">
      </div>
      <div id="output" class="output"></div>
    </div>

    <div data-panel="trace" class="panel" hidden>
      <div class="controls">
        <label for="budget" data-i18n="trace.budget">Бюджет, тактов</label>
        <input id="budget" type="number" min="1" max="1000000" value="200">
      </div>
      <!-- Подпись - одна строка словаря: разметка внутри переводимого текста
           потребовала бы `innerHTML` из словаря, то есть лишнего пути в DOM.
           Ключ `-s` остался в строке, элемент `code` снят. -->
      <!-- Сценариев в проекте бывает несколько: который прогоняем,
           выбирается здесь. Проект называет свой, выбор читателя живёт в
           черновике — то же правило, что у цели сборки. -->
      <div id="scenariopick" class="controls" hidden>
        <label for="scenariofile" data-i18n="trace.scenarioFile">Сценарий</label>
        <select id="scenariofile"></select>
      </div>
      <label for="scenario" data-i18n="trace.scenario">Сценарий входов (JSON, как файл -s у takt-sim)</label>
      <!-- Сценарий - такая же область кода, как модель и вывод: те же номера
           строк тем же счётчиком. У `textarea` строк-узлов нет вовсе, и номер
           пришлось бы рисовать второй колонкой, синхронизируя прокрутку. -->
      <div id="scenario" class="editor scenario" data-i18n-attr="aria-label:trace.scenario"
           aria-label="Сценарий входов"></div>
      <!-- Разделитель рядов вкладки: сколько отдано сценарию, сколько трассе. -->
      <div id="tsplit" class="split split-h" role="separator" aria-orientation="horizontal"
           data-i18n-attr="aria-label:trace.rows" aria-label="Высота сценария" tabindex="0"></div>
      <div id="tools-lang-trace" class="notice" data-i18n="tools.russianOnly" hidden>Сообщения инструментов пока только на русском</div>
      <div id="trace" class="list trace" aria-live="polite"></div>
    </div>

    <!-- Схема состояний: уведомление о расхождении раскладки с моделью,
         крошки уровня, полоса холста с легендой. Узлы холста строит `scheme.js`
         построением, не разметкой из данных: имена состояний пишет автор. -->
    <div data-panel="scheme" class="panel panel-scheme" hidden>
      <div id="scheme-notice" class="notice conflict" hidden>
        <span id="scheme-notice-text"></span>
        <button id="scheme-drop" type="button" data-i18n="scheme.staleDrop">убрать</button>
      </div>
      <!-- Строка уровня: путь входа, кнопка "наверх" и кнопки холста на одной
           линии. Инструменты стоят здесь, а не над листом: панель поверх рисунка
           закрывала бы узлы, а строка уровня и так занимает свою высоту. -->
      <div class="scheme-bar">
        <!-- Прогон, шаг и стоп: те же кнопки, что в панели прогона, - схема
             показывает ход автомата подсветкой, и тянуться за пуском в другую
             область незачем. Действие и доступность у них общие с оригиналом
             (`data-run`), второго обработчика не заводится. -->
        <div class="scheme-tools scheme-run">
          <span class="seg">
          <button class="icon-btn" type="button" data-run="run"
                  data-i18n-attr="aria-label:trace.run;data-tip:trace.run"
                  aria-label="Прогон" data-tip="Прогон"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 5l11 7-11 7z"/></svg></button>
          <button class="icon-btn" type="button" data-run="step"
                  data-i18n-attr="aria-label:trace.step;data-tip:trace.step"
                  aria-label="Шаг" data-tip="Шаг"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5l10 7-10 7z"/><path d="M18.5 5v14"/></svg></button>
          <button class="icon-btn" type="button" data-run="stop" disabled
                  data-i18n-attr="aria-label:trace.stop;data-tip:trace.stop"
                  aria-label="Стоп" data-tip="Стоп"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
          </span>
        </div>
        <nav id="crumbs" class="crumbs" data-i18n-attr="aria-label:scheme.level" aria-label="Уровень схемы">
          <button id="scheme-up" class="icon-btn" type="button" disabled
                  data-i18n-attr="aria-label:scheme.up;data-tip:scheme.up" aria-label="Наверх" data-tip="Наверх"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 20V5"/><path d="M6 11l6-6 6 6"/></svg></button>
        </nav>
        <div id="scheme-tools" class="scheme-tools">
          <span class="seg tool-wide">
        <button class="icon-btn" type="button" data-act="zoom-out" data-i18n-attr="aria-label:scheme.zoomOut;data-tip:scheme.zoomOut" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M7.5 10.5h6"/></svg></button>
        <button class="icon-btn" type="button" data-act="zoom-in" data-i18n-attr="aria-label:scheme.zoomIn;data-tip:scheme.zoomIn" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/><path d="M7.5 10.5h6M10.5 7.5v6"/></svg></button>
          </span>
          <span id="zoom" class="zoom-value tool-wide"></span>
          <span class="seg">
        <button class="icon-btn" type="button" data-act="fit" data-i18n-attr="aria-label:scheme.fit;data-tip:scheme.fit" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5"/><path d="M15 4h5v5"/><path d="M20 15v5h-5"/><path d="M9 20H4v-5"/><path d="M9.5 9.5h5v5h-5z"/></svg></button>
        <button class="icon-btn" type="button" data-act="center" data-narrow="hide" data-i18n-attr="aria-label:scheme.center;data-tip:scheme.center" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg></button>
        <button class="icon-btn" type="button" data-act="auto" data-narrow="hide" data-i18n-attr="aria-label:scheme.autoLayout;data-tip:scheme.autoLayout" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 3.5h5v4h-5z"/><path d="M3.5 16.5h5v4h-5z"/><path d="M15.5 16.5h5v4h-5z"/><path d="M12 7.5v3M6 16.5V13h12v3.5"/></svg></button>
          </span>
          <span class="seg tool-wide">
        <button class="icon-btn" type="button" data-act="legend-bottom" aria-pressed="true" data-i18n-attr="aria-label:scheme.legend.bottom;data-tip:scheme.legend.bottom" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 3.5h17v10h-17z"/><path d="M3.5 16h17v4.5h-17z"/></svg></button>
        <button class="icon-btn" type="button" data-act="legend-right" aria-pressed="false" data-i18n-attr="aria-label:scheme.legend.right;data-tip:scheme.legend.right" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 3.5h11v17h-11z"/><path d="M17 3.5h3.5v17H17z"/></svg></button>
        <button class="icon-btn" type="button" data-act="legend-float" aria-pressed="false" data-i18n-attr="aria-label:scheme.legend.float;data-tip:scheme.legend.float" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 3.5h17v17h-17z"/><path d="M8.5 8.5h9v6h-9z"/></svg></button>
          </span>
          <span class="seg tool-wide">
        <button class="icon-btn" type="button" data-act="pin-add" data-i18n-attr="aria-label:scheme.pinAdd;data-tip:scheme.pinAdd" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20v-8h8"/><circle cx="12" cy="12" r="2.5"/><path d="M16.5 6.5h5M19 4v5"/></svg></button>
        <button class="icon-btn" type="button" data-act="pin-drop" data-i18n-attr="aria-label:scheme.pinDrop;data-tip:scheme.pinDrop" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20v-8h8"/><circle cx="12" cy="12" r="2.5"/><path d="M16.5 6.5h5"/></svg></button>
          </span>
          <button class="icon-btn" type="button" data-act="settings" data-i18n-attr="aria-label:scheme.settings;data-tip:scheme.settings" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 3.5v3M12 17.5v3M3.5 12h3M17.5 12h3M6 6l2.1 2.1M15.9 15.9L18 18M18 6l-2.1 2.1M8.1 15.9L6 18"/></svg></button>
          <button class="icon-btn" type="button" data-act="nav" aria-pressed="false" data-i18n-attr="aria-label:scheme.navigator;data-tip:scheme.navigatorHint" aria-label="" data-tip=""><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3.5 4.5h17v15h-17z"/><path d="M9 4.5v15"/><path d="M12 9h6M12 12h6M12 15h4"/></svg></button>
        </div>
      </div>
      <div id="stage" class="scheme-stage legend-side-bottom">
        <div id="scheme" class="scheme" tabindex="0" data-i18n-attr="aria-label:scheme.canvas" aria-label="Схема состояний модели">
          <svg id="sheet" class="sheet" role="img"></svg>
          <div id="nav" class="scheme-nav" hidden></div>
          <svg id="map" class="minimap" viewBox="0 0 128 96" role="img" data-i18n-attr="aria-label:scheme.minimap" aria-label="Миникарта листа"></svg>
          <div id="scheme-empty" class="sheet-empty" data-i18n="scheme.empty" hidden>Схема появится, когда модель разберётся</div>
        </div>
        <div id="legend" class="legend legend-bottom" data-i18n-attr="aria-label:scheme.legend" aria-label="Легенда обозначений"></div>
      </div>
    </div>
    <!-- Ключи сборки выбором: та же строка, что в поле "Ключи сборки", только
         собранная контролами. Список ключей строит `flags.js` и сверяет с
         разбором аргументов сторож — свой список разошёлся бы молча. -->
    <!-- Показ пояснения: правая область вместо вывода цели, когда открыт
         файл `.md` (задача 09n, решение заказчика). ⚠️ Узлы строит `md.js`
         построением, а не `innerHTML`: текст пишет автор проекта, а видят его
         читатели витрины. -->
    <div data-panel="doc" class="panel" hidden>
      <div id="doc" class="doc"></div>
    </div>

    <div data-panel="flags" class="panel" hidden>
      <div class="controls">
        <span class="muted" data-i18n="flags.title">Ключи сборки — выбором</span>
        <span id="flags-applies" class="muted"></span>
      </div>
      <div id="flags" class="flags"></div>
    </div>
  </section>
</main>

<!-- Полка режимов: видна только на узком экране (см. app.css). Подпись у
     каждой цели остаётся словом — по одним значкам вкладку находят не все. -->
<nav id="modes" class="modes" role="tablist" data-i18n-attr="aria-label:modes.label" aria-label="Область">
  <button class="tab active" data-mode="source" role="tab" aria-selected="true" type="button" data-i18n="modes.source">Модель</button>
  <button class="tab" data-mode="output" role="tab" aria-selected="false" type="button" data-i18n="modes.output">Вывод</button>
  <button class="tab" data-mode="trace" role="tab" aria-selected="false" type="button" data-i18n="modes.trace">Прогон</button>
  <button class="tab" data-mode="scheme" role="tab" aria-selected="false" type="button" data-i18n="modes.scheme">Схема</button>
</nav>

<!-- Ручка ширины оболочки: на широком экране читатель задаёт, какой колонкой
     стоит страница (решение заказчика 2026-09-04). На узком её нет — там
     область одна на экран. -->
<div id="grip" class="grip" role="separator" aria-orientation="vertical"
     data-i18n-attr="aria-label:bar.width" aria-label="Ширина страницы" tabindex="0"></div>

<script type="module" src="boot.js"></script>
<!-- Вход - модальное окно: вход это не "ещё
     одна панель страницы», а короткий разговор, из которого выходят с ответом
     «вошёл» либо «отменил». Панель учётной записи осталась своим — проектами,
     файлами и профилем.
     ⚠️ Кнопки площадок строятся ПО ОТВЕТУ СЕРВЕРА: имён площадок в коде
     страницы нет, их объявляет он же — и подпись, и значок. -->
<!-- Настройки отрисовки схемы: каркас окна здесь, содержимое вкладок строит
     `scheme-settings.js` построением - кнопки-образцы рисуются теми же классами,
     что и лист, и второго набора правил рисования не заводится. Правка видна на
     схеме сразу; "Отменить" возвращает раскладку к снимку при открытии. -->
<div id="scheme-modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true"
       data-i18n-attr="aria-label:scheme.settings" aria-label="Настройки схемы">
    <div class="modal-head" data-i18n="scheme.settings">Настройки схемы</div>
    <div id="scheme-tabs" class="tabs" role="tablist"></div>
    <div id="scheme-settings" class="modal-body settings-body"></div>
    <div class="modal-foot">
      <button id="scheme-cancel" type="button" data-i18n="scheme.settingsCancel">Отменить</button>
      <button id="scheme-save" type="button" class="primary" data-i18n="scheme.settingsSave">Сохранить</button>
    </div>
  </div>
</div>
<div id="signin-modal" class="modal" hidden>
  <div class="modal-box" role="dialog" aria-modal="true"
       data-i18n-attr="aria-label:account.enter" aria-label="Войти">
    <div class="modal-head" data-i18n="account.signinTitle">Вход</div>
    <div id="signedout" class="modal-body">
      <input id="login" type="text" autocomplete="username" spellcheck="false"
             data-i18n-attr="placeholder:account.login" placeholder="Логин">
      <input id="password" type="password" autocomplete="current-password"
             data-i18n-attr="placeholder:account.password" placeholder="Пароль">
      <div class="modal-actions">
        <button id="signin" class="pair" type="button" data-i18n="account.signIn">Войти</button>
        <button id="signin-cancel" class="pair" type="button" data-i18n="account.cancel">Отмена</button>
        <button id="signup" class="primary" type="button" data-i18n="account.signUp">Регистрация</button>
      </div>
    </div>
    <div id="oauth" class="modal-brands" hidden></div>
    <!-- Первый вход через площадку: логин выбирает человек - имени с
         площадки мы не читаем и не храним. -->
    <div id="pick" class="modal-body" hidden>
      <input id="picklogin" type="text" spellcheck="false"
             data-i18n-attr="placeholder:oauth.loginPlaceholder" placeholder="Логин (3…32, латиница)">
      <button id="pickok" type="button" data-i18n="oauth.pickOk">Продолжить</button>
    </div>
  </div>
</div>

</body>
</html>
