[package]
name = "takt-wasm-io"
version = "0.1.0"
authors = ["Pastor <viruszold@gmail.com>"]
description = "Takt — учебный DSL конечных автоматов: протокол обмена модулей WebAssembly со страницей — буфер, вызов операции, форма ответа"
homepage = "https://but.ru"
repository = "https://github.com/Pastor/Takt"
readme = "../README.md"
keywords = ["Takt", "wasm", "webassembly"]
license = "BSD"
edition = "2024"
# MSRV: проверено на пине толчейна (rust-toolchain.toml), как у соседних крейтов.
rust-version = "1.97"
include = ["Cargo.toml", "src/**/*", "README.md", "LICENSE*"]

[lib]
bench = false

[dependencies]
# Форма ответа переводит диагностику компилятора в форму страницы.
takt-lang = { path = "../takt-lang" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
